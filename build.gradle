plugins {
	// The no-remap Loom plugin: Minecraft 26.x is unobfuscated, so neither
	// Minecraft nor mods are remapped and the plain `jar` task is the artifact.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The artifact version carries the game and loader it was built against, so a jar that has
// been separated from its download page still says what it is. Both live in the build
// metadata after the plus sign, which semantic versioning ignores when ordering releases.
version = "${mod_version}+mc${minecraft_version}-fabric"

loom {
	mods {
		"whotickstoolong" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// Surface deprecated Minecraft APIs by name: leaning on one is a version-fragility
	// risk we want to see rather than discover after a game update.
	it.options.compilerArgs << '-Xlint:deprecation'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
