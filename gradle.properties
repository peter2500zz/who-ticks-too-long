org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Minecraft 26.1 and later ship unobfuscated, so there are no yarn/intermediary
# mappings here on purpose: loom applies no remapping at all.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.19

# The full artifact version is assembled in build.gradle from this and the game version.
mod_version=0.3.0
group=plus.mygo

fabric_api_version=0.157.0+26.2
